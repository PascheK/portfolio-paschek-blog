<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Blog thumbnail template</title><desc>1920x1080. Edit the eyebrow, the two title lines and the meta row.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#373e53"/><stop offset="1" stop-color="#1e222d"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#97a8dd" stop-opacity="0.30"/><stop offset="1" stop-color="#97a8dd" stop-opacity="0"/></radialGradient>
</defs>
<g id="background">
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1560" cy="260" r="680" fill="url(#glow)"/>
</g>
<g id="eyebrow">
  <circle cx="128" cy="262" r="8" fill="#97a8dd"/>
  <text x="156.0" y="272" font-family="Geist Mono, monospace" font-weight="500" font-size="26" letter-spacing="5" fill="#9096a8">BLOG · CATEGORY</text>
</g>
<g id="title">
  <rect id="marker" x="120" y="516" width="489" height="37" fill="#97a8dd" fill-opacity="0.34"/>
  <text x="120.0" y="420" font-family="Geist, sans-serif" font-weight="600" font-size="108" letter-spacing="-3.6" fill="#ececf2">Your article title</text>
  <text x="120.0" y="548" font-family="Geist, sans-serif" font-weight="600" font-size="108" letter-spacing="-3.6" fill="#ececf2">goes here</text>
  <rect id="period" x="625" y="524" width="24" height="24" fill="#97a8dd"/>
</g>
<g id="meta">
  <text x="120.0" y="690" font-family="Geist Mono, monospace" font-weight="400" font-size="26" letter-spacing="1.5" fill="#9096a8">27 OCT 2026  ·  6 MIN READ</text>
</g>
<g id="brand">
  <text x="1730.0" y="938" text-anchor="end" font-family="Geist, sans-serif" font-weight="600" font-size="30" letter-spacing="-0.3" fill="#ececf2">PascheK</text>
  <image x="1752" y="902" width="48" height="48" xlink:href="data:image/svg+xml;base64," href="data:image/svg+xml;base64,"/>
</g>
<g id="guides" display="none" font-family="Geist Mono, monospace" font-size="16">
  <rect x="0.5" y="0.5" width="1919" height="1079" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <rect x="120" y="128" width="1680" height="824" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="12 8"/>
  <line x1="0" y1="128" x2="1920" y2="128" stroke="#ff3b6b" stroke-width="2"/>
  <line x1="0" y1="952" x2="1920" y2="952" stroke="#ff3b6b" stroke-width="2"/>
  <text x="130" y="116" fill="#ff3b6b">21:9 CROP (article header): nothing important above this line</text>
  <text x="130" y="978" fill="#ff3b6b">21:9 CROP: nothing important below this line</text>
  <text x="130" y="152" fill="#00e5ff">SAFE ZONE 1680 x 824 (120 px margins)</text>
</g>
</svg>
